name: Alpha Prime Install Backend Deploy Validator

on:
  push:
    branches:
      - 'alpha-prime/autonomous-completion-v2'

permissions:
  contents: write

concurrency:
  group: alpha-prime-install-backend-deploy-validator
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  install-backend-deploy-validator:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-prime/autonomous-completion-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install deterministic backend deployment evidence gate
        run: node scripts/alpha-prime/install-backend-deploy-validator.mjs
      - name: Validate backend function source boot readiness
        run: node scripts/alpha-prime/static-audit.mjs backend-functions-source
      - name: Run safe regression packet before commit
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=critical
          node scripts/alpha-prime/static-audit.mjs schema-valid
          node scripts/alpha-prime/static-audit.mjs oversized-fields
          node scripts/alpha-prime/static-audit.mjs input-validation
          node scripts/alpha-prime/static-audit.mjs contract-safety
      - name: Commit only permanent validator changes
        run: |
          if git diff --quiet; then
            echo "No permanent backend-deploy validator changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/alpha-prime-validation.yml \
            base44/entities/BackendDeployReceipt.jsonc \
            base44/functions/runValidators/entry.ts \
            scripts/alpha-prime/static-audit.mjs \
            docs/alpha-prime/BACKEND_DEPLOY_EVIDENCE.md
          git commit -m "Add exact-SHA backend deployment validator"
          git push origin HEAD:alpha-prime/autonomous-completion-v2
