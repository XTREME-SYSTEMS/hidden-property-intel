name: Alpha Prime Install Ingestion Validators

on:
  push:
    branches:
      - alpha-prime/autonomous-completion-v2
    paths:
      - scripts/alpha-prime/install-ingestion-validators.mjs
      - .github/workflows/alpha-prime-install-ingestion-validators.yml

permissions:
  contents: write

concurrency:
  group: alpha-prime-install-ingestion-validators
  cancel-in-progress: false

jobs:
  install-and-validate:
    if: github.ref == 'refs/heads/alpha-prime/autonomous-completion-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic ingestion validators
        run: node scripts/alpha-prime/install-ingestion-validators.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency regression
        run: npm audit --audit-level=critical

      - name: Schema regression
        run: node scripts/alpha-prime/static-audit.mjs schema-valid

      - name: Oversized-field regression
        run: node scripts/alpha-prime/static-audit.mjs oversized-fields

      - name: Input-validation regression
        run: node scripts/alpha-prime/static-audit.mjs input-validation

      - name: Contract-safety regression
        run: node scripts/alpha-prime/static-audit.mjs contract-safety

      - name: Commit validated repair
        shell: bash
        run: |
          if git diff --quiet -- base44/functions/runValidators/entry.ts; then
            echo "No validator integration change required."
            exit 0
          fi
          git config user.name "alpha-prime-repair[bot]"
          git config user.email "alpha-prime-repair[bot]@users.noreply.github.com"
          git add base44/functions/runValidators/entry.ts
          git commit -m "feat(alpha-prime): add exact-SHA ingestion validators"
          git push origin HEAD:alpha-prime/autonomous-completion-v2
