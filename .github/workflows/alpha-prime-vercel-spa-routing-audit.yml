name: Alpha Prime Vercel SPA Routing Audit

on:
  push:
    branches:
      - main
      - 'alpha-prime/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-prime-vercel-spa-routing-audit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  vercel-spa-routing-audit:
    name: vercel-spa-routing-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Vercel SPA fallback configuration
        run: |
          set +e
          node scripts/alpha-prime/vercel-spa-routing-audit.mjs 2>&1 | tee vercel-spa-routing-audit.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > vercel-spa-routing-audit.exit
          exit "$ec"
      - name: Upload exact-SHA routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-vercel-spa-routing-evidence
          path: |
            vercel-spa-routing-audit.log
            vercel-spa-routing-audit.exit
          if-no-files-found: error
          retention-days: 7
