name: Alpha Prime Wire External Gates

on:
  push:
    branches:
      - alpha-prime/autonomous-completion-v2
    paths:
      - .github/workflows/alpha-prime-wire-external-gates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-prime-wire-external-gates
  cancel-in-progress: false

jobs:
  wire-and-revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-prime/autonomous-completion-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-anchor validator wiring
        run: node scripts/alpha-prime/wire-external-gate-validators.mjs
      - name: Reject malformed diff
        run: git diff --check
      - name: Run full safe regression packet
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=critical
          node scripts/alpha-prime/static-audit.mjs schema-valid
          node scripts/alpha-prime/static-audit.mjs oversized-fields
          node scripts/alpha-prime/static-audit.mjs input-validation
          node scripts/alpha-prime/static-audit.mjs contract-safety
      - name: Commit only fully revalidated central-validator wiring
        run: |
          if git diff --quiet; then
            echo "No wiring change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/runValidators/entry.ts
          git commit -m "Alpha Prime: wire receipt-backed mandatory gates into governor"
          git push origin HEAD:alpha-prime/autonomous-completion-v2
