name: Alpha Prime Supervisor Validation

on:
  push:
    branches:
      - alpha-prime/autonomous-completion-v6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-truth-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deterministic Alpha Prime source-truth guard
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/alpha-prime/source-truth-guard.mjs 2>&1 | tee alpha-prime-source-truth-${GITHUB_SHA}.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact-SHA source-truth receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-source-truth-${{ github.sha }}
          path: alpha-prime-source-truth-${{ github.sha }}.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce source-truth result
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

  scheduler-surface-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deterministic scheduler surface audit
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/alpha-prime/scheduler-surface-audit.mjs 2>&1 | tee alpha-prime-scheduler-${GITHUB_SHA}.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact-SHA scheduler receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-scheduler-${{ github.sha }}
          path: alpha-prime-scheduler-${{ github.sha }}.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce scheduler result
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1
