name: Alpha Prime Digital Agent Truth Audit

on:
  push:
    branches:
      - main
      - 'alpha-prime/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-prime-digital-agent-truth-audit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  digital-agent-truth-audit:
    name: digital-agent-truth-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject fabricated human identity data in digital-agent UI
        run: |
          set +e
          node scripts/alpha-prime/digital-agent-truth-audit.mjs 2>&1 | tee digital-agent-truth-audit.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > digital-agent-truth-audit.exit
          exit "$ec"
      - name: Upload exact-SHA truthfulness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-digital-agent-truth-evidence
          path: |
            digital-agent-truth-audit.log
            digital-agent-truth-audit.exit
          if-no-files-found: error
          retention-days: 7
