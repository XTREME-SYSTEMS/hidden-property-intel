name: Alpha Prime Wire Frontend Gates

on:
  push:
    branches:
      - alpha-prime/autonomous-completion-v2
    paths:
      - scripts/alpha-prime/wire-frontend-gates.mjs
      - .github/workflows/alpha-prime-wire-frontend-gates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-prime-wire-frontend-gates
  cancel-in-progress: false

jobs:
  wire-frontend-gates:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-prime/autonomous-completion-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact deterministic gate wiring
        run: node scripts/alpha-prime/wire-frontend-gates.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated branch-only repair
        run: |
          if git diff --quiet; then
            echo "No repair diff produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/runValidators/entry.ts
          git commit -m "feat(alpha-prime): wire frontend exact-SHA gate evidence"
          git push origin HEAD:alpha-prime/autonomous-completion-v2
