name: HPI Scraper CI

on:
  pull_request:
    paths:
      - "railway/**"
      - ".github/workflows/hpi-scraper-ci.yml"
  push:
    branches: [main]
    paths:
      - "railway/**"
      - ".github/workflows/hpi-scraper-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: railway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
