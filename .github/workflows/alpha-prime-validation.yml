name: Alpha Prime Validation

on:
  push:
    branches:
      - main
      - 'alpha-prime/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-prime-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  repair-lint:
    name: repair-lint
    needs: lint
    if: ${{ always() && needs.lint.result == 'failure' && startsWith(github.ref, 'refs/heads/alpha-prime/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply safe ESLint autofixes
        run: npm run lint:fix || true
      - name: Commit only deterministic autofixes
        run: |
          if git diff --quiet; then
            echo "No safe ESLint autofix changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-repair lint findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run typecheck and capture evidence
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > typecheck.exit
          exit "$ec"
      - name: Upload typecheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-typecheck-evidence
          path: |
            typecheck.log
            typecheck.exit
          if-no-files-found: error
          retention-days: 7

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=critical

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI 8.30.1
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo /tmp/gitleaks_checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(grep 'gitleaks_8.30.1_linux_x64.tar.gz' /tmp/gitleaks_checksums.txt | awk '{print $1}')
          actual=$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')
          test -n "$expected" && test "$expected" = "$actual"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan git history for secrets
        run: /tmp/gitleaks git . --redact --no-banner --exit-code 1

  schema-valid:
    name: schema-valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/alpha-prime/static-audit.mjs schema-valid

  oversized-fields:
    name: oversized-fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/alpha-prime/static-audit.mjs oversized-fields

  input-validation:
    name: input-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run input validation audit and capture evidence
        run: |
          set +e
          node scripts/alpha-prime/static-audit.mjs input-validation 2>&1 | tee input-validation.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > input-validation.exit
          exit "$ec"
      - name: Upload input-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-input-validation-evidence
          path: |
            input-validation.log
            input-validation.exit
          if-no-files-found: error
          retention-days: 7

  contract-safety:
    name: contract-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract safety audit and capture evidence
        run: |
          set +e
          node scripts/alpha-prime/static-audit.mjs contract-safety 2>&1 | tee contract-safety.log
          ec=${PIPESTATUS[0]}
          echo "$ec" > contract-safety.exit
          exit "$ec"
      - name: Upload contract-safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-prime-contract-safety-evidence
          path: |
            contract-safety.log
            contract-safety.exit
          if-no-files-found: error
          retention-days: 7
