name: Alpha Prime Wire Resilience Gate

on:
  push:
    branches:
      - 'alpha-prime/**'
    paths:
      - 'scripts/alpha-prime/wire-resilience-gate.mjs'
      - '.github/workflows/alpha-prime-wire-resilience-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-prime-wire-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-resilience-gate:
    if: ${{ startsWith(github.ref, 'refs/heads/alpha-prime/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact deterministic gate wiring
        run: node scripts/alpha-prime/wire-resilience-gate.mjs
      - name: Prove resilience validator fails for evidence, not harness error
        run: |
          set +e
          node scripts/alpha-prime/static-audit.mjs resilience-fallback > resilience-wire-proof.log 2>&1
          ec=$?
          set -e
          cat resilience-wire-proof.log
          test "$ec" -eq 1
          grep -q "declared core single point of failure" resilience-wire-proof.log
      - name: Regress repaired tree
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          node scripts/alpha-prime/static-audit.mjs schema-valid
          node scripts/alpha-prime/static-audit.mjs oversized-fields
          node scripts/alpha-prime/static-audit.mjs input-validation
          node scripts/alpha-prime/static-audit.mjs contract-safety
      - name: Commit only deterministic gate wiring
        run: |
          if git diff --quiet -- base44/functions/runValidators/entry.ts; then
            echo "No gate wiring change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/runValidators/entry.ts
          git commit -m "Alpha Prime: wire resilience gate to exact-SHA CI evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
